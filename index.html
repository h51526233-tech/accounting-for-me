<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b5fd9">
<title>دفتر البيت</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e3e1da;--in:#1f7a4d;--ex:#b3392f;--ac:#2b5fd9}
@media(prefers-color-scheme:dark){:root{--bg:#171716;--card:#232321;--tx:#f0efe9;--mu:#9d9b92;--bd:#34332f;--in:#4cc38a;--ex:#ef7b70;--ac:#7ea2ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:520px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center}h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.r{display:flex;gap:8px}.r>*{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:#fff;cursor:pointer;width:100%;margin-top:12px}
.seg{display:flex;gap:8px}.seg button{margin:0;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.seg button.on.e{background:var(--ex);color:#fff;border-color:var(--ex)}.seg button.on.i{background:var(--in);color:#fff;border-color:var(--in)}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.sum small{display:block;color:var(--mu);font-size:12px}.sum b{font-size:15px}
.i{color:var(--in)}.e{color:var(--ex)}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}.row small{color:var(--mu);display:block;font-size:12px}
.sm{width:auto;margin:0;padding:3px 9px;background:none;color:var(--mu);border:1px solid var(--bd);font-size:12px}
.mu{color:var(--mu);font-size:13px}.msg{color:var(--ex);font-size:13px;min-height:18px}
.n{direction:ltr;unicode-bidi:plaintext;text-align:left}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyArypz2V27qmgvfXE3nPjk6ChkJIQYaHwI",authDomain:"accounting-for-me.firebaseapp.com",projectId:"accounting-for-me",storageBucket:"accounting-for-me.firebasestorage.app",messagingSenderId:"514526893213",appId:"1:514526893213:web:0fe36dfc7de2112a75b074"});
const auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const NAMES={'aliali1209120t@gmail.com':'haidara','j68975793@gmail.com':'koko'};

const $=s=>document.querySelector(s);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const fmt=(n,d=0)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let user=null,who='',key=null,rows=[],rates={},bad=0,type='expense',month=today().slice(0,7),unsubs=[];

// التشفير: AES-256-GCM والمفتاح من كلمة سر التشفير
const b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mkKey(p){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('home-ledger-v1'),iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function enc(o){const iv=crypto.getRandomValues(new Uint8Array(12));
const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(o))));
const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);return b64(all);}
async function dec(s){const a=unb64(s);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},key,a.slice(12))));}

// المسار: دخول، ثم كلمة التشفير، ثم التطبيق
onAuthStateChanged(auth,async u=>{
 unsubs.forEach(f=>f());unsubs=[];user=u;
 if(!u){key=null;return loginScreen()}
 who=NAMES[(u.email||'').toLowerCase()]||u.email;
 if(!key&&ls.get('pw'))try{key=await mkKey(ls.get('pw'))}catch(e){}
 key?start():phraseScreen();
});

function loginScreen(msg=''){
 $('#app').innerHTML=`<h1>دفتر البيت</h1><div class="card"><h2>تسجيل الدخول</h2>
 <label>الإيميل</label><input id="em" type="email" class="n" autocomplete="username">
 <label>كلمة السر</label><input id="pw" type="password" class="n" autocomplete="current-password">
 <div class="msg" id="lm">${msg}</div><button id="go">دخول</button></div>`;
 $('#go').onclick=async()=>{$('#lm').textContent='';
  try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}
  catch(e){$('#lm').textContent='الإيميل أو كلمة السر غلط'}};
}

function phraseScreen(msg=''){
 $('#app').innerHTML=`<h1>دفتر البيت</h1><div class="card"><h2>كلمة سر التشفير</h2>
 <p class="mu">غير كلمة سر الدخول. لازم تكون نفسها عند الاثنين، وبيتم فيها تشفير كل البيانات قبل ما تطلع من الجهاز. إذا ضاعت ما في طريقة لاسترجاع البيانات.</p>
 <input id="ph" type="password" class="n"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rm" style="width:auto" checked> تذكّرها على هالجهاز</label>
 <div class="msg" id="lm">${msg}</div><button id="go">متابعة</button><button class="sm" id="lo" style="margin-top:8px">تسجيل خروج</button></div>`;
 $('#lo').onclick=()=>signOut(auth);
 $('#go').onclick=async()=>{const p=$('#ph').value;if(p.length<6){$('#lm').textContent='6 أحرف على الأقل';return}
  key=await mkKey(p);$('#rm').checked?ls.set('pw',p):ls.del('pw');start()};
}

function start(){
 main();
 unsubs.push(onSnapshot(collection(db,'rates'),async s=>{const o={};
  for(const d of s.docs)try{o[d.id]=(await dec(d.data().c)).rate}catch(e){}
  rates=o;syncRate();render()}));
 unsubs.push(onSnapshot(collection(db,'tx'),async s=>{const out=[];bad=0;
  for(const d of s.docs)try{out.push({id:d.id,...await dec(d.data().c)})}catch(e){bad++}
  rows=out;render()},e=>{$('#list').innerHTML='<p class="msg">خطأ: '+esc(e.message)+'</p>'}));
}

function main(){
 const now=new Date();
 $('#app').innerHTML=`<h1><span>دفتر البيت <span class="mu">· ${esc(who)}</span></span><button class="sm" id="lo">خروج</button></h1>
 <div class="card"><h2>عملية جديدة</h2>
 <div class="seg"><button class="e on" id="te">مصروف</button><button class="i" id="ti">دخل</button></div>
 <label>النوع (مشتريات / مصدر الدخل)</label><input id="cat" list="cats" placeholder="مثلاً: خضار، راتب"><datalist id="cats"><option>أكل<option>فواتير<option>مواصلات<option>ملابس<option>صحة<option>راتب<option>أخرى</datalist>
 <label>المبلغ بالليرة السورية</label><input id="am" type="number" inputmode="decimal" class="n">
 <div class="r"><div><label>التاريخ</label><input id="dt" type="date" value="${today()}"></div><div><label>الوقت</label><input id="tm" type="time" value="${now.toTimeString().slice(0,5)}"></div></div>
 <label>سعر الصرف لهاليوم (ل.س لكل $)</label><input id="rt" type="number" inputmode="decimal" class="n">
 <div class="mu" id="rh"></div><div class="msg" id="fm"></div><button id="add">حفظ</button></div>
 <div class="card"><div class="r" style="align-items:center"><h2 style="margin:0">ملخص الشهر</h2><input id="mo" type="month" value="${month}"></div>
 <div class="sum" id="sum" style="margin-top:10px"></div></div>
 <div class="card"><h2>العمليات</h2><div id="list"><p class="mu">عم نحمّل...</p></div></div>`;
 const setT=t=>{type=t;$('#te').className='e'+(t=='expense'?' on':'');$('#ti').className='i'+(t=='income'?' on':'')};
 $('#te').onclick=()=>setT('expense');$('#ti').onclick=()=>setT('income');
 $('#lo').onclick=()=>{ls.del('pw');signOut(auth)};
 $('#mo').onchange=e=>{month=e.target.value;render()};
 $('#dt').onchange=()=>{$('#rt').value='';syncRate()};
 $('#add').onclick=async()=>{const am=+$('#am').value,rt=+$('#rt').value,cat=$('#cat').value.trim(),date=$('#dt').value,time=$('#tm').value;
  if(!cat||!(am>0)||!(rt>0)||!date){$('#fm').textContent='عبّي النوع والمبلغ وسعر الصرف';return}
  $('#fm').textContent='';const err=e=>{$('#fm').textContent='ما انحفظت: '+(e.message||e.code)};
  try{
   if(rates[date]!==rt)setDoc(doc(db,'rates',date),{c:await enc({rate:rt,who})}).catch(err);
   setDoc(doc(db,'tx',crypto.randomUUID()),{c:await enc({type,cat,am,date,time,who})}).catch(err);
   $('#am').value='';$('#cat').value='';
  }catch(e){err(e)}};
 syncRate();render();
}

function syncRate(){
 const el=$('#rt');if(!el)return;const r=rates[$('#dt').value];
 if(document.activeElement!==el)el.value=r||'';
 $('#rh').textContent=r?'سعر مشترك بينكن لهاليوم. تعديله بيغيّر حساب كل عمليات هاليوم.':'ما في سعر لهاليوم، دخّله مرة وحدة وبيظهر عند الاثنين.';
}

function render(){
 if(!$('#list'))return;
 const m=rows.filter(r=>(r.date||'').startsWith(month)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 const usd=r=>rates[r.date]?r.am/rates[r.date]:0;
 const s={income:[0,0],expense:[0,0]};m.forEach(r=>{s[r.type][0]+=r.am;s[r.type][1]+=usd(r)});
 const net=[s.income[0]-s.expense[0],s.income[1]-s.expense[1]];
 const box=(l,v,c)=>`<div><small>${l}</small><b class="${c} n">${fmt(v[0])} ل.س</b><small class="n">$${fmt(v[1],2)}</small></div>`;
 $('#sum').innerHTML=box('الدخل',s.income,'i')+box('المصاريف',s.expense,'e')+box('الصافي',net,net[0]>=0?'i':'e');
 $('#list').innerHTML=(bad?`<p class="msg">${bad} عملية ما انفكت (كلمة التشفير مختلفة؟)</p>`:'')+
 (m.length?m.map(r=>`<div class="row"><div><b>${esc(r.cat)}</b><small>${esc(r.who)} · ${esc(r.date)} ${esc(r.time||'')}</small></div>
 <div style="text-align:end"><b class="${r.type=='income'?'i':'e'} n">${r.type=='income'?'+':'−'}${fmt(r.am)} ل.س</b>
 <small class="n">${rates[r.date]?'$'+fmt(usd(r),2)+' @ '+fmt(rates[r.date]):'بدون سعر صرف'}</small>
 <button class="sm" data-id="${r.id}">حذف</button></div></div>`).join(''):'<p class="mu">ما في عمليات بهالشهر.</p>');
 document.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{if(confirm('حذف هالعملية؟'))deleteDoc(doc(db,'tx',b.dataset.id))});
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
